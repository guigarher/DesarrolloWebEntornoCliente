<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Economato . Login</title>
    <link rel="stylesheet" href="assets/css/estilo_login.css">
    <script type="module" src="src/controllers/loginController.js"></script>
</head>
<body>
    <header>
        <h1>Smart-Economato</h1>
        <img src="assets/img/LOGO CIFP VIRGEN DE CANDELARIA.png" alt="logo virgen de candelaria">
        <h2>Login</h2>
    </header>
    <main>
        <div id="loginMessage"></div>
        <form id="login-form" method="post">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="a__login">Iniciar Sesión</button>
        </form>
    </main>
</body>
<footer>
    <p>© 2025 Smart-Economato. Todos los derechos reservados.</p>
</footer>
</html>
