    <div class="recepcion">
       <form id="form-recepcion">
        <div class="form-group">
            <fieldset>
                <legend>Producto</legend>
                <label class="form-field">
                    <span>Código de barras</span>
                    <input type="text" id="codigoBarras" name="codigoBarras">
                </label>
                <label class="form-field">
                    <span>Cantidad (kg/L/ud)</span>
                    <input type="number" id="cantidad" name="cantidad">
                </label>
                <label class="form-field">
                    <span>Nombre Producto</span>
                    <input type="text" id="nombreProducto" name="nombreProducto">
                </label>
                <label class="form-field">
                    <span>PVP (€)</span>
                    <input type="number" id="pvp" name="pvp">
                </label>
            </fieldset>
            <fieldset>
                <legend>Albarán</legend>
                <label class="form-field">
                    <span>Nº Albarán</span>
                    <input type="text" id ="numAlbaran" name="numAlbaran">
                </label>
                <label class="form-field">
                    <span>Fecha</span>
                    <input type="date" id="fecha" name="fecha">
                </label>
                <label class="form-field">
                    <span>Proveedor</span>
                    <select id="proveedorId" name="proveedorId" class="select-recepcion">
                        <option value="">Selecciona proveedor…</option>
                    </select>
                    </label>
                <label class="form-field">
                    <span>Incidencias</span>
                    <input type="text" id="incidencias" name="incidencias">
                </label>
            </fieldset>
        </div>
            <button type="button" id="btnAddLinea" class="form-button">Añadir producto</button>
            <div class="tabla-wrapper" tabindex="0" aria-label="Tabla de productos">
            <table class="tablaProductosRecepcion">
                <caption>Productos añadidos a la recepción</caption>
                <thead>
                <tr>
                    <th scope="col">Código</th>
                    <th scope="col">Producto</th>
                    <th scope="col">Cantidad</th>
                    <th scope="col">PVP (€)</th>
                    <th scope="col"><span class="sr-only">Acciones</span></th>
                </tr>
                </thead>
                <tbody id="tablaBody">
                </tbody>
            </table>
        </div>
            <button class="form-button" id="btnRegistrarRecepcion" type="button">Registrar Recepción</button>
       </form> 
       
    </div>
