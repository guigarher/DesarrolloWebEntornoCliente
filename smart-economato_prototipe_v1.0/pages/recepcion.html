       <form id="form-recepcion">
        <div class="form-group">
            <fieldset>
                <legend>Albarán</legend>
                <label class="form-field">
                    <span>Nº Albarán</span>
                    <input type="text" required>
                </label>
                <label class="form-field">
                    <span>Fecha</span>
                    <input type="date" required>
                </label>
                <label class="form-field">
                    <span>Proveedor</span>
                    <input type="text" required>
                </label>
                <label class="form-field">
                    <span>Incidencias</span>
                    <input type="text">
                </label>
            </fieldset>
            <fieldset>
                <legend>Productos</legend>
                <label class="form-field">
                    <span>Código de barras</span>
                    <input type="text" required>
                </label>
                <label class="form-field">
                    <span>Cantidad (kg/L/ud)</span>
                    <input type="number" required>
                </label>
                <label class="form-field">
                    <span>Nombre Producto</span>
                    <input type="text" required>
                </label>
                <label class="form-field">
                    <span>PVP (€)</span>
                    <input type="number" required>
                </label>
            </fieldset>
        </div>
            <button class="form-button" type="submit">Registrar Recepción</button>
       </form>
