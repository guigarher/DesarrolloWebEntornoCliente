<div class="pedidos-profesores">
  <!-- Buscador de productos del inventario -->
  <div class="buscador-productos">
    <label>
      Buscar producto (inventario):
      <input type="text" id="input-buscar-producto" placeholder="Tomate, pan, leche...">
    </label>
    <ul id="lista-sugerencias"></ul>
  </div>

  <!-- Producto fuera de inventario -->
  <div class="producto-libre">
    <label>
      Añadir producto fuera de inventario:
      <input type="text" id="input-producto-libre" placeholder="Ej: Café descafeinado especial">
    </label>
    <button id="btn-add-producto-libre" type="button">Añadir</button>
  </div>

  <!-- Tabla con líneas ya añadidas al pedido -->
  <table id="tabla-pedido-profesor">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Proveedor</th>
        <th>Cantidad</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="btn-guardar-pedido">Guardar pedido de este profesor</button>
</div>
