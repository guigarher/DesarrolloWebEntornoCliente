<div class="registro">
       <form id="form-registro">
        <div class="form-group-registro">
            <fieldset class="fieldset-registro">
                <legend>Registrar nuevo proveedor</legend>
                <label class="form-field-registro">
                    <span>Nombre proveedor</span>
                    <input type="text" id="nombreProveedor" name="nombreProveedor">
                </label>
                <label class="form-field-registro">
                    <span>Nombre contacto</span>
                    <input type="text" id="nombreContacto" name="nombreContacto">
                </label>
                <label class="form-field-registro">
                    <span>Número de teléfomo</span>
                    <input type="text" id="numeroTelefono" name="numeroTelefono">
                </label>
                <label class="form-field-registro">
                    <span>Correo electrónico</span>
                    <input type="email" id="email" name="email">
                </label>
                <label class="form-field-registro">
                    <span>Dirección</span>
                    <input type="text" id="direccion" name="direccion">
                </label>
            </fieldset>
            <button class="form-button" id="btnRegistrarProveedor" type="button">Registrar Proveedor</button>
        </div>
       </form> 
       <form id="form-registro">
        <div class="form-group-registro">
            <fieldset class="fieldset-registro">
                <legend>Registrar nuevo producto</legend>
                <label class="form-field-registro">
                    <span>Nombre producto</span>
                    <input type="text" id="nombreProducto" name="nombreProducto">
                </label>
                <label class="form-field-registro">
                    <span>Código de barras</span>
                    <input type="text" id="codigoBarras" name="codigoBarras">
                </label>
                <label class="form-field-registro">
                    <span>Precio</span>
                    <input type="number" id="precio" name="precio">
                </label>
                <label class="form-field-registro">
                    <span>Unidad medida</span>
                    <select id="unidadMedidad" name="unidadMedidad" class="select-registro"><option value="">Selecciona...</option></select> 
                </label>
                <label class="form-field-registro">
                    <span>Stock mínimo</span>
                    <input type="number" id="stockMinimo" name="stockMinimo">
                </label>
                <label class="form-field-registro">
                    <span>Categoría</span>
                    <select id="categoriaId" name="categoriaId" class="select-registro">
                        <option value="">Selecciona categoría...</option>
                    </select>
                </label>
                <label class="form-field-registro">
                    <span>Proveedor</span>
                    <select id="proveedorIdProducto" name="proveedorIdProducto" class="select-registro">
                        <option value="">Selecciona proveedor...</option>
                    </select>
                </label>
            </fieldset>
            <button class="form-button" id="btnRegistrarProducto" type="button">Registrar Producto</button>
        </div>
       </form>  
    </div>
