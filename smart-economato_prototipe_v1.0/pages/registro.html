<div class="registro">

  <!--NAVEGACIÓN-->
  <div class="registro-tabs">
    <button type="button" class="registro-tab active" data-target="seccion-proveedor">
      Registrar Proveedor
    </button>
    <button type="button" class="registro-tab" data-target="seccion-producto">
      Registrar Producto
    </button>
    <button type="button" class="registro-tab" data-target="seccion-categoria">
      Registrar Categoría
    </button>
    <button type="button" class="registro-tab" data-target="seccion-usuario">
      Registrar Usuario
    </button>
  </div>

  <!--PROVEEDOR-->
  <section id="seccion-proveedor" class="registro-section active">
    <form id="form-proveedor">
      <fieldset class="fieldset-registro">
        <legend>Registrar nuevo proveedor</legend>

        <label class="form-field-registro">
          <span>Nombre proveedor</span>
          <input type="text" id="nombreProveedor">
        </label>

        <label class="form-field-registro">
          <span>Nombre contacto</span>
          <input type="text" id="nombreContacto">
        </label>

        <label class="form-field-registro">
          <span>Número de teléfono</span>
          <input type="text" id="numeroTelefono">
        </label>

        <label class="form-field-registro">
          <span>Correo electrónico</span>
          <input type="email" id="emailProveedor">
        </label>

        <label class="form-field-registro">
          <span>Dirección</span>
          <input type="text" id="direccionProveedor">
        </label>
      </fieldset>

      <button class="form-button" id="btnRegistrarProveedor" type="button">
        Registrar Proveedor
      </button>
    </form>
  </section>

  <!--PRODUCTO-->
  <section id="seccion-producto" class="registro-section">
    <form id="form-producto">
      <fieldset class="fieldset-registro">
        <legend>Registrar nuevo producto</legend>

        <label class="form-field-registro">
          <span>Nombre producto</span>
          <input type="text" id="nombreProducto">
        </label>

        <label class="form-field-registro">
          <span>Código de barras</span>
          <input type="text" id="codigoBarras">
        </label>

        <label class="form-field-registro">
          <span>Precio</span>
          <input type="number" id="precio" step="0.01">
        </label>

        <label class="form-field-registro">
          <span>Unidad medida</span>
          <select id="unidadMedida" class="select-registro">
            <option value="">Selecciona...</option>
            <option value="kg">kg</option>
            <option value="l">l</option>
            <option value="ud">ud</option>
          </select>
        </label>

        <label class="form-field-registro">
          <span>Stock mínimo</span>
          <input type="number" id="stockMinimo">
        </label>

        <label class="form-field-registro">
          <span>Categoría</span>
          <select id="categoriaId" class="select-registro">
            <option value="">Selecciona categoría...</option>
          </select>
        </label>

        <label class="form-field-registro">
          <span>Proveedor</span>
          <select id="proveedorIdProducto" class="select-registro">
            <option value="">Selecciona proveedor...</option>
          </select>
        </label>

      </fieldset>

      <button class="form-button" id="btnRegistrarProducto" type="button">
        Registrar Producto
      </button>
    </form>
  </section>

  <!--CATEGORÍA-->
  <section id="seccion-categoria" class="registro-section">
    <form id="form-categoria">
      <fieldset class="fieldset-registro">
        <legend>Registrar nueva categoría</legend>

        <label class="form-field-registro">
          <span>Nombre categoría</span>
          <input type="text" id="nombreCategoria">
        </label>

        <label class="form-field-registro">
          <span>Descripción</span>
          <input type="text" id="descripcionCategoria">
        </label>
      </fieldset>

      <button class="form-button" id="btnRegistrarCategoria" type="button">
        Registrar Categoría
      </button>
    </form>
  </section>

  <!--USUARIO-->
  <section id="seccion-usuario" class="registro-section">
    <form id="form-usuario">
      <fieldset class="fieldset-registro">
        <legend>Registrar nuevo usuario</legend>

        <label class="form-field-registro">
          <span>Username</span>
          <input type="text" id="usernameUsuario">
        </label>

        <label class="form-field-registro">
          <span>Password</span>
          <input type="password" id="passwordUsuario">
        </label>

        <label class="form-field-registro">
          <span>Rol</span>
          <select id="rolUsuario" class="select-registro">
            <option value="">Selecciona rol...</option>
            <option value="admin">Administrador</option>
            <option value="almacen">Almacén</option>
            <option value="profesor">Profesor</option>
          </select>
        </label>

        <label class="form-field-registro">
          <span>Nombre</span>
          <input type="text" id="nombreUsuario">
        </label>

        <label class="form-field-registro">
          <span>Apellidos</span>
          <input type="text" id="apellidosUsuario">
        </label>

        <label class="form-field-registro">
          <span>Email</span>
          <input type="email" id="emailUsuario">
        </label>

        <label class="form-field-registro">
          <span>Teléfono</span>
          <input type="text" id="telefonoUsuario">
        </label>

      </fieldset>

      <button class="form-button" id="btnRegistrarUsuario" type="button">
        Registrar Usuario
      </button>
    </form>
  </section>

</div>
